server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ledger}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 启动时执行 schema.sql / data.sql（脚本自身幂等，可重复执行）
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true

ledger:
  session:
    # 会话有效期（小时），台账系统自控（requirement.md 约束 4）
    ttl-hours: ${SESSION_TTL_HOURS:8}

feishu:
  # 飞书企业自建应用凭证与回调域名：遗留事项，部署时通过环境变量注入（requirement.md 第 6 节）
  app-id: ${FEISHU_APP_ID:}
  app-secret: ${FEISHU_APP_SECRET:}
  redirect-uri: ${FEISHU_REDIRECT_URI:http://localhost:5173/api/auth/callback}
  # state 签名密钥：生产环境必须通过环境变量覆盖
  state-secret: ${FEISHU_STATE_SECRET:change-me-in-production}
  # 开发期模拟开关（默认关闭）：凭证未到位时置 true，用模拟用户走通本地登录链路
  mock-enabled: ${FEISHU_MOCK_ENABLED:false}
  mock-mobile: ${FEISHU_MOCK_MOBILE:13800000000}
